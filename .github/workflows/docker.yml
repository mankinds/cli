name: Docker publish
on:
  release:
    types: [published]
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          set -e
          if [[ "${{ github.event_name }}" == "release" ]]; then
            TAG_FULL="${{ github.ref_name }}"
            TAG_MAJOR="${TAG_FULL%%.*}"
            TAG_MINOR="${TAG_FULL%.*}"
            TAGS="ghcr.io/mankinds/ci:${TAG_FULL},ghcr.io/mankinds/ci:${TAG_MAJOR},ghcr.io/mankinds/ci:${TAG_MINOR},ghcr.io/mankinds/ci:latest"
          else
            TAGS="ghcr.io/mankinds/ci:edge,ghcr.io/mankinds/ci:sha-${GITHUB_SHA::7}"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          provenance: true
          sbom: true
