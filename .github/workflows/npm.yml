# Publishes @mankinds/cli to npm on a GitHub release.
#
# Only the npm package is published here. The GitHub Action is served by the
# committed dist/ bundle and the tag, and the Docker image by docker.yml, so
# all three artefacts ship from the same release without sharing a build.
#
# Nothing publishes on a push: a release has to be cut deliberately. The tag
# and package.json must agree, which the guard below enforces rather than
# trusting.
name: npm publish
on:
  release:
    types: [published]

permissions:
  contents: read
  # Required for npm provenance, which ties the published tarball to this
  # workflow run so a consumer can verify where it was built.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      # src/version.ts must agree with package.json too, since it is what
      # `--version` prints. That one is asserted by a unit test, so only the
      # tag is checked here.
      - name: Check the tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Release tag $TAG does not match package.json ($PKG)."
            exit 1
          fi
          echo "Publishing $PKG"

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

      - name: Ensure the committed dist/ is in sync
        run: git diff --exit-code dist/

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
