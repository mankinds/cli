name: Self-test
on:
  pull_request:
  push:
    branches: [main]

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - name: Ensure committed dist/ is in sync with sources
        run: git diff --exit-code dist/ || (echo "dist/ is stale. Run 'npm run build' and commit." && exit 1)

  docker:
    runs-on: ubuntu-latest
    needs: node
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t mankinds-ci:test -f docker/Dockerfile .
      - name: Smoke test (--help)
        run: docker run --rm mankinds-ci:test --help
